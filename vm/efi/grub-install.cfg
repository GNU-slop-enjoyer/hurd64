# GRUB EFI entry for tuxhurd: GNU Mach via multiboot2, root on NVMe (ld0)
set timeout=2
insmod part_msdos
insmod ext2
insmod gzio
insmod multiboot2
insmod efi_gop
insmod all_video
search --no-floppy --file --set=esp /gnumach-efi.gz
search --no-floppy --fs-uuid --set=root 41bea907-da2e-4747-b848-8a2af4ce43bf
menuentry "tuxhurd (NVMe, UEFI)" {
	multiboot2	($esp)/gnumach-efi.gz root=part:2:device:ld2 console=com0
	module2		/hurd/pci-arbiter.static pci-arbiter --host-priv-port='${host-port}' --device-master-port='${device-port}' --next-task='${acpi-task}' '$(pci-task=task-create)' '$(task-resume)'
	module2		($esp)/acpi-efi.static acpi --next-task='${disk-task}' '$(acpi-task=task-create)'
	module2		/hurd/rumpdisk-nvme.static rumpdisk --next-task='${fs-task}' '$(disk-task=task-create)'
	module2		/hurd/ext2fs.static ext2fs --readonly --multiboot-command-line='${kernel-command-line}' --exec-server-task='${exec-task}' -T typed '${root}' '$(fs-task=task-create)'
	module2		/lib/ld-x86-64.so.1 exec /hurd/exec '$(exec-task=task-create)'
}
